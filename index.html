<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registro de Atendimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Registro de Atendimentos</h1>

        <!-- FORMULÁRIO -->
        <form class="formulario" onsubmit="salvarAtendimento(); return false;">
            <input type="text" id="cliente" placeholder="Nome do cliente">
            <input type="text" id="contrato" placeholder="Contrato (000/000)">

            <select id="tipo">
                <option value="Retido">Retido</option>
                <option value="Suporte">Suporte</option>
                <option value="Venda">Venda</option>
                <option value="Cancelado">Cancelado</option>
                <option value="Transferida">Transferida</option>
                <option value="Informações">Informações</option>
                <option value="Combo Multi">Combo Multi</option>
            </select>

            <select id="status">
                <option>Informações do contrato</option>
                <option>Total</option>
                <option>Mudança de Pacote</option>
                <option>Mudança de Endereço</option>
                <option>Downgrade</option>
                <option>Upgrade</option>
                <option>Suspensão temporária</option>
                <option>Cancelamento MDE</option>
                <option>Agendamento de VT</option>
                <option>Venda Controle/ Pós Pago</option>
                <option>Transferida Supervisão</option>
                <option>Transferida Muda</option>
                <option>Ligar no 0800/*1052</option>
            </select>

            <input type="text" id="obs" placeholder="Observação rápida">
            <button type="submit">Salvar Atendimento</button>
        </form>

        <!-- ESTATÍSTICAS -->
        <h2>Estatísticas</h2>
        <div class="estatisticas">
            <p>Total de Atendimentos: <span id="totalAtendimentos">0</span></p>
            <p>Total de Cancelamentos: <span id="totalCancelamentos">0</span></p>
            <p>Taxa de Cancelamento: <span id="taxaCancelamento">0%</span></p>
        </div>

        <!-- LISTA ONDE OS ATENDIMENTOS APARECEM (A Telinha) -->
        <h2>Atendimentos Salvos</h2>
        <div id="listaAtendimentos"></div>

        <!-- BLOCO DE NOTAS LIVRE -->
        <h2>Bloco de Anotações</h2>
        <div id="blocoNotas" class="bloco-notas" contenteditable="true"></div>

        <!-- LEGENDA DE CORES -->
        <div class="legenda-container">
            <span class="legenda-item"><span class="bola" style="background-color: #1976d2;"></span> Venda</span>
            <span class="legenda-item"><span class="bola" style="background-color: #fbc02d;"></span> Suporte</span>
            <span class="legenda-item"><span class="bola" style="background-color: #4CAF50;"></span> Retido</span>
            <span class="legenda-item"><span class="bola" style="background-color: #F44336;"></span> Cancelado</span>
            <span class="legenda-item"><span class="bola" style="background-color: #E91E63;"></span> Transferida</span>
        </div>

        <!-- RODAPÉ -->
        <footer>
            Desenvolvido por Nathan Rocha |
            📞 <a href="tel:+5582993717863">(82) 99371-7863</a> |
            📧 <a href="mailto:nathanxpon18y@gmail.com">nathanxpon18y@gmail.com</a>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
